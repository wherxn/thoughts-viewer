<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>想法记录</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <!-- 页面标题 -->
    <header class="page-header">
      <h1 class="page-title">想法记录</h1>
      <p class="page-subtitle">快速检索与浏览你的每一个想法</p>
    </header>

    <!-- 搜索框 -->
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜索想法..."
          autocomplete="off"
        >
        <button id="clearSearchBtn" class="clear-search-btn" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- 筛选器 -->
    <div class="filters-container">
      <div class="filter-item">
        <label class="filter-label">一级分类</label>
        <select id="filterCategory1" class="filter-select">
          <option value="">全部一级</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">二级分类</label>
        <select id="filterCategory2" class="filter-select">
          <option value="">全部二级</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">三级分类</label>
        <select id="filterCategory3" class="filter-select">
          <option value="">全部三级</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">收藏标注</label>
        <select id="filterFavorite" class="filter-select">
          <option value="">全部标注</option>
        </select>
      </div>
      <div class="filter-item filter-actions">
        <button id="refreshBtn" class="refresh-btn" title="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
          刷新
        </button>
      </div>
    </div>

    <!-- 记录计数 -->
    <div class="stats-bar">
      <span id="recordCount" class="record-count">共 0 条记录</span>
      <span id="filterHint" class="filter-hint"></span>
    </div>

    <!-- 加载状态 -->
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p>正在加载想法记录...</p>
    </div>

    <!-- 错误状态 -->
    <div id="errorState" class="error-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v4"></path>
        <path d="M12 16h.01"></path>
      </svg>
      <p id="errorMessage">加载失败</p>
      <button id="retryBtn" class="retry-btn">重试</button>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M9 15h6"></path>
        <path d="M9 11h6"></path>
      </svg>
      <p>没有找到匹配的想法记录</p>
      <p class="empty-hint">试试调整筛选条件或搜索关键词</p>
    </div>

    <!-- 卡片列表 -->
    <div id="cardList" class="card-list"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
