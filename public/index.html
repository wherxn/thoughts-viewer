<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>想法记录</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 登录页面 -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <path d="M9 15h6"></path>
          <path d="M9 11h6"></path>
        </svg>
      </div>
      <h1 class="login-title">想法记录</h1>
      <p class="login-subtitle">快速检索与浏览你的每一个想法</p>
      <p class="login-desc">此页面需要飞书账号授权登录</p>
      <a href="/api/auth/login" class="login-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        用飞书登录
      </a>
      <p id="loginError" class="login-error" style="display:none;"></p>
    </div>
  </div>

  <!-- 主内容（登录后显示） -->
  <div id="mainView" style="display:none;">
  <div class="container">
    <!-- 页面标题 -->
    <header class="page-header">
      <div class="header-left">
        <h1 class="page-title">想法记录</h1>
        <p class="page-subtitle">快速检索与浏览你的每一个想法</p>
      </div>
      <div class="header-right">
        <div class="user-info">
          <span id="userOpenId" class="user-open-id"></span>
          <a href="/api/auth/logout" class="logout-btn">退出登录</a>
        </div>
      </div>
    </header>

    <!-- 搜索框 -->
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜索想法..."
          autocomplete="off"
        >
        <button id="clearSearchBtn" class="clear-search-btn" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- 筛选器 -->
    <div class="filters-container">
      <div class="filter-item">
        <label class="filter-label">一级分类</label>
        <select id="filterCategory1" class="filter-select">
          <option value="">全部一级</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">二级分类</label>
        <select id="filterCategory2" class="filter-select">
          <option value="">全部二级</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">三级分类</label>
        <select id="filterCategory3" class="filter-select">
          <option value="">全部三级</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">收藏标注</label>
        <select id="filterFavorite" class="filter-select">
          <option value="">全部标注</option>
        </select>
      </div>
      <div class="filter-item filter-actions">
        <button id="refreshBtn" class="refresh-btn" title="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
          刷新
        </button>
      </div>
    </div>

    <!-- 记录计数 -->
    <div class="stats-bar">
      <span id="recordCount" class="record-count">共 0 条记录</span>
      <span id="filterHint" class="filter-hint"></span>
    </div>

    <!-- 加载状态 -->
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p>正在加载想法记录...</p>
    </div>

    <!-- 错误状态 -->
    <div id="errorState" class="error-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v4"></path>
        <path d="M12 16h.01"></path>
      </svg>
      <p id="errorMessage">加载失败</p>
      <button id="retryBtn" class="retry-btn">重试</button>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M9 15h6"></path>
        <path d="M9 11h6"></path>
      </svg>
      <p>没有找到匹配的想法记录</p>
      <p class="empty-hint">试试调整筛选条件或搜索关键词</p>
    </div>

    <!-- 卡片列表 -->
    <div id="cardList" class="card-list"></div>
  </div>
  </div>

  <!-- 附件预览弹窗 -->
  <div id="previewModal" class="preview-modal" style="display:none;">
    <div class="preview-overlay" id="previewOverlay"></div>
    <div class="preview-container">
      <div class="preview-header">
        <span class="preview-title" id="previewTitle">附件预览</span>
        <div class="preview-actions">
          <a id="previewDownloadBtn" class="preview-download-btn" href="#" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            下载
          </a>
          <button id="previewCloseBtn" class="preview-close-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="preview-body" id="previewBody">
        <!-- 动态内容：图片 / PDF iframe / 文件信息 -->
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
